<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6f2" />
  <title>Studio Yoan</title>

  <style>
    :root {
      --page-max: 760px;
      --side: clamp(22px, 7vw, 54px);
      --glass-bg: rgba(255, 255, 255, 0.18);
      --glass-border: rgba(255, 255, 255, 0.62);
      --glass-border-dark: rgba(0, 0, 0, 0.08);
      --text: rgba(12, 12, 12, 0.92);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #f7f6f2;
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", "Pretendard",
        "Noto Sans KR", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
    }

    .page {
      position: relative;
      width: min(100%, var(--page-max));
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #f7f6f2;
    }

    /* Background image */
    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      width: min(100%, var(--page-max));
      margin-inline: auto;
      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.06),
          rgba(255,255,255,0.02)
        ),
        url("bg.jpg") center top / cover no-repeat;
    }

    /* Very subtle milk-glass veil */
    .page::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      width: min(100%, var(--page-max));
      margin-inline: auto;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.02);
    }

    main {
      min-height: 100svh;
      padding:
        max(58px, env(safe-area-inset-top))
        var(--side)
        max(42px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      margin: 0 0 clamp(42px, 6vh, 64px);
      display: flex;
      justify-content: center;
    }

    .brand img {
      display: block;
      width: min(59.2%, 368px);
      max-height: 94px;
      object-fit: contain;
      object-position: center;
      filter: none;
    }

    .links {
      display: grid;
      gap: 12px;
      width: 90%;
      margin: 132px auto 0;
    }

    .glass-button {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 66px;
      padding: 14px 20px;
      border-radius: 21px;

      color: var(--text);
      text-decoration: none;
      text-align: center;
      font-size: clamp(16px, 3.9vw, 20px);
      font-weight: 400;
      letter-spacing: -0.025em;

      /* iOS-style liquid glass base */
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.135) 0%,
          rgba(255,255,255,0.05) 44%,
          rgba(255,255,255,0.09) 100%
        );
      border: 1px solid rgba(255,255,255,0.42);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.50),
        inset 0 -1px 0 rgba(255,255,255,0.08),
        0 8px 22px rgba(20, 20, 20, 0.04),
        0 1px 2px rgba(20, 20, 20, 0.025);

      -webkit-backdrop-filter: blur(14px) saturate(125%);
      backdrop-filter: blur(14px) saturate(125%);
      overflow: hidden;
      transform: translateZ(0);
      transition:
        transform 160ms ease,
        background 160ms ease,
        box-shadow 160ms ease;
    }

    /* outline-only button */
    .glass-button::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: none;
      box-shadow: none;
      pointer-events: none;
    }

    .glass-button::after {
      content: none;
    }

    .glass-button span {
      position: relative;
      z-index: 1;
    }

    .glass-button .brand-thin {
      font-weight: 300;
    }

    .glass-button:active {
      transform: scale(0.985);
      background: transparent;
      box-shadow: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .glass-button:hover {
        transform: translateY(-1px);
        background: transparent;
        box-shadow: none;
      }
    }

    @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
      .glass-button {
        background: transparent;
      }
    }

    @media (max-height: 760px) {
      main {
        justify-content: flex-start;
        padding-top: max(40px, env(safe-area-inset-top));
      }

      .brand {
        margin-bottom: 32px;
      }

      .glass-button {
        min-height: 60px;
      }

      .links {
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <main>
      <header class="brand">
        <img src="logo.png" alt="Studio Yoan" />
      </header>

      <nav class="links" aria-label="Studio Yoan links">
        <a class="glass-button"
           href="https://map.naver.com/p/entry/place/2069576630?placePath=%2Fticket%3Fentry%3Dpll%26from%3Dnx%26fromNxList%3Dtrue%26from%3Dmap%26fromPanelNum%3D1%26additionalHeight%3D76%26timestamp%3D202608201741%26locale%3Dko%26svcName%3Dmap_pcv5&placeSearchOption=entry%3Dpll%26fromNxList%3Dtrue&searchType=place&c=15.00,0,0,0,dh">
          <span>촬영 예약하기</span>
        </a>

        <a class="glass-button"
           href="https://pf.kakao.com/_pzJxhX?utm_source=ig&utm_medium=social&utm_content=link_in_bio&fbclid=PAcGRvZgJmZGlkFlDNb-HCPmJbphUZu1noIixIkRbZ3dhleHRuA2FlbQIxMQBzcnRjBmFwcF9pZA8xMjQwMjQ1NzQyODc0MTQAAadnCFc4Leet1oUwkZx779emg7qgbFRmQr3U8cGGsrEpmS4Tbwa5LLanO_EMrQ_aem_XlAx7s6rky0kShsmnUUZtQ">
          <span>카카오채널 상담하기</span>
        </a>

        <a class="glass-button"
           href="https://blog.naver.com/hi_juliana">
          <span>네이버 블로그</span>
        </a>

        <a class="glass-button"
           href="http://www.interviewm.com/news/articleView.html?idxno=5850">
          <span>기사 읽기 1 · <span class="brand-thin">크루크루(CREWCREW)</span></span>
        </a>

        <a class="glass-button"
           href="http://www.interviewm.com/news/articleView.html?idxno=5857">
          <span>기사 읽기 2 · <span class="brand-thin">패이보릭(FABORIC)</span></span>
        </a>
      </nav>
    </main>
  </div>
</body>
</html>
